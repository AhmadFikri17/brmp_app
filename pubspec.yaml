name: weather
description: Aplikasi Monitoring Cuaca Kacang Weather
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  device_preview: ^1.1.0
  mqtt_client: ^10.5.0
  provider: ^6.1.2
  video_player: ^2.8.3
  webview_flutter: ^4.4.2
  share_plus: ^7.2.1
  path_provider: ^2.1.1
  printing: ^5.11.1
  pdf: ^3.10.7
  http: ^1.1.0
  
  # Firebase dependencies
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  google_sign_in: ^7.0.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/